# Application locations shared by the HTTP and HTTPS site configs
# (nginx/templates/*.conf.template). Included inside a `server` block.

client_max_body_size 10m;

# Setup workbook apply — hashing many temporary passwords can take minutes.
location = /api/v1/admin/setup/import/apply {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# API reverse proxy — everything under /api/ goes to the Node service.
location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# Static assets — long cache with immutable hashes from Vite.
location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Correct MIME for sqlite-wasm.
location ~* \.wasm$ {
    root /usr/share/nginx/html;
    default_type application/wasm;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# SPA fallback — everything else serves index.html so React Router works.
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/wasm
    image/svg+xml;
