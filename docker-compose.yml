services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: workforce-competency-api:latest
    container_name: wca-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/apps/api/data/workforce.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_MAX_AGE_MS: ${SESSION_MAX_AGE_MS:-28800000}
      # Set to "true" only once HTTPS is terminating at nginx. While running
      # over plain HTTP, keep this "false" so the session cookie is actually
      # accepted by browsers.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      # Trust the first proxy hop (nginx) so X-Forwarded-* headers are honoured.
      TRUST_PROXY: "1"
    volumes:
      - api_data:/app/apps/api/data
    networks:
      - wca
    expose:
      - "3000"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: /api/v1
    image: workforce-competency-nginx:latest
    container_name: wca-nginx
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Serves HTTP until certbot has a certificate for DOMAIN, then switches
      # to HTTPS on its own (nginx/docker-entrypoint.d/40-wca-config.sh).
      DOMAIN: ${DOMAIN:-}
      DOMAIN_ALIASES: ${DOMAIN_ALIASES:-}
    ports:
      # TLS terminates here, so the standard ports must be bound for
      # Let's Encrypt HTTP-01 challenges to reach nginx.
      - "80:80"
      - "443:443"
      # Swap for these when running locally alongside something already on 80/443.
      # - "8066:80"
      # - "6443:443"
    volumes:
      # certbot writes certificates and challenge files here.
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/certbot-www:/var/www/certbot
    networks:
      - wca

  certbot:
    # Issues the first certificate for DOMAIN and renews it (nginx/certbot/run.sh).
    # Idles when DOMAIN or LETSENCRYPT_EMAIL is not set.
    image: certbot/certbot:v2.11.0
    container_name: wca-certbot
    restart: unless-stopped
    depends_on:
      - nginx
    entrypoint: ["/bin/sh", "/opt/wca/run.sh"]
    environment:
      DOMAIN: ${DOMAIN:-}
      DOMAIN_ALIASES: ${DOMAIN_ALIASES:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - ./nginx/certbot/run.sh:/opt/wca/run.sh:ro
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/certbot-www:/var/www/certbot

networks:
  wca:
    driver: bridge

volumes:
  api_data:
